<div class="new-troll-overlay" role="dialog" aria-modal="true" aria-labelledby="new-troll-title">
  <button class="new-troll-backdrop" type="button" aria-label="Fermer la création" (click)="close()"></button>
  <section class="new-troll-modal">
    <div class="section-heading">
      <div>
        <p class="eyebrow">NOUVEAU COMBATTANT</p>
        <h1 id="new-troll-title">Créer un troll</h1>
      </div>
      <button class="modal-close" type="button" aria-label="Fermer" (click)="close()">×</button>
    </div>
    <div class="new-troll-content">
      <div>
        <label class="field-label" for="new-troll-name">Nom du troll</label>
        <input id="new-troll-name" class="text-input" type="text" maxlength="24" placeholder="Ex. Brak le massif" [value]="name()" (input)="name.set($any($event.target).value)">
        <div class="points-heading">
          <span>Répartis les 40 points</span>
          <span class="points-count" [class.points-complete]="pointsRemaining() === 0">{{ pointsRemaining() }} restants</span>
        </div>
      </div>
      <button class="button button-secondary random-button" type="button" (click)="randomizeStats()">Stats aléatoires</button>
    </div>
    <div class="stat-editor">
      @for (key of statKeys; track key) {
        <label [class]="'stat-input-row ' + statClass(key)" [for]="'new-create-' + key">
          <span>{{ statLabels[key] }}</span>
          <span class="stat-stepper">
            <button class="step-button" type="button" [attr.aria-label]="'Retirer un point de ' + statLabels[key]" [disabled]="draftStats()[key] <= 1" (click)="adjustStat(key, -1)">−</button>
            <strong [id]="'new-create-' + key">{{ draftStats()[key] }}</strong>
            <button class="step-button" type="button" [attr.aria-label]="'Ajouter un point à ' + statLabels[key]" [disabled]="pointsRemaining() <= 0" (click)="adjustStat(key, 1)">+</button>
          </span>
        </label>
      }
    </div>
    <button class="button button-primary full-width" type="button" [disabled]="!name().trim() || pointsRemaining() !== 0" (click)="createTroll()">Forger mon troll</button>
    @if (pointsRemaining() < 0) { <p class="form-hint error-text">La somme des caractéristiques doit être égale à 40.</p> }
  </section>
</div>
